version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hospital-postgres
    environment:
      POSTGRES_DB: hospitalflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-service
    container_name: hospital-ai-service
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=mock
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: hospital-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hospitalflow
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - AI_SERVICE_URL=http://ai-service:8000/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: hospital-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
