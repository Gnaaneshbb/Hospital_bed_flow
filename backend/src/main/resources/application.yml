server:
  port: 8080

spring:
  application:
    name: hospital-flow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:hospitalflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000/api/v1}

jwt:
  secret: HospitalFlowAISecretKeySuperLongSecureTokenForJWTValidation2026!
  expiration: 86400000
